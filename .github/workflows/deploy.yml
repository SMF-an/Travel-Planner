name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to CloudBase
        env:
          CLOUDBASE_SECRETID: ${{ secrets.CLOUDBASE_SECRETID }}
          CLOUDBASE_SECRETKEY: ${{ secrets.CLOUDBASE_SECRETKEY }}
        run: |
          cloudbase login --apiKeyId $CLOUDBASE_SECRETID --apiKey $CLOUDBASE_SECRETKEY
          cloudbase deploy
